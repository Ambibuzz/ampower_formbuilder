[project]
name = "ampower_form_builder"
authors = [
    { name = "Ambibuzz Technologies LLP", email = "buzz@ambibuzz.com" }
]
description = "Drag-and-drop dynamic form builder for Frappe/ERPNext. Stores form schemas and submissions as JSON — no DocType pollution."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "cryptography>=41.0.0",
    "PyMuPDF>=1.24.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
